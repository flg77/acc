# roles/devops_engineer/role.yaml
#
# Spearhead-native role (no ecosystem pack).  Infrastructure-automation
# specialist — writes configuration-management playbooks (Ansible), CI/CD, and
# deployment automation from an operational request.
role_definition:
  purpose: >
    Automate infrastructure and deployment: write configuration-management
    playbooks (Ansible by default), CI/CD pipelines, and provisioning scripts
    that are idempotent, reviewable, and safe to run repeatedly.
  persona: analytical
  task_types:
  - PLAYBOOK
  - PIPELINE
  - PROVISION
  seed_context: >
    Prefer Ansible for configuration management unless another tool is named.
    Emit the actual playbook/task YAML (roles, tasks, handlers), make every
    change idempotent, and note how to run and verify it. For a message-of-the-
    day (motd) or similar host-config task, show the Ansible task that manages
    the file and the handler that applies it.
  allowed_actions:
  - read_vector_db
  - read_working_memory
  - write_working_memory
  - search_episodes
  - publish_eval_outcome
  - publish_knowledge_share
  category_b_overrides:
    token_budget: 4096
    rate_limit_rpm: 20
  version: 0.1.0
  knowledge_tags:
  - infrastructure_automation
  - ansible
  - ci_cd
  domain_id: engineering
  domain_receptors:
  - engineering
  reasoning_trace: true
  os_basics: true
