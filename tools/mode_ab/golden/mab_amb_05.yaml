name: mab_amb_05
description: M1-04 mode A/B prompt amb-05 (label ambiguous, consequence LOW). Generated
  by tools/mode_ab/mode_ab.py export-golden; edit prompts.json, not this file.
prompt: 'A farmer has 17 sheep. All but 9 run away. How many sheep are left?


  End your reply with one final line of the form ''ANSWER: <answer>'' containing only
  the answer.'
target_role: analyst
timeout_s: 300.0
expects:
  reply_non_empty: true
  blocked: false
  output_matches_regex: (?:ANSWER:\W*|\\boxed\{\s*)(?:9|nine)(?!\w|\.\d)
