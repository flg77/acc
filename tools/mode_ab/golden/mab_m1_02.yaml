name: mab_m1_02
description: M1-04 mode A/B prompt m1-02 (label mode1, consequence LOW). Generated
  by tools/mode_ab/mode_ab.py export-golden; edit prompts.json, not this file.
prompt: 'Classify this support ticket as exactly one of: bug, feature, question.

  Ticket: "Could you add a dark mode to the dashboard?"


  End your reply with one final line of the form ''ANSWER: <answer>'' containing only
  the answer.'
target_role: analyst
timeout_s: 300.0
expects:
  reply_non_empty: true
  blocked: false
  output_matches_regex: (?:ANSWER:\W*|\\boxed\{\s*)(?:feature)(?!\w|\.\d)
