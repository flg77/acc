# skills/kg_query/skill.yaml — read the collective's knowledge store (RDF-05).
#
# Granted only to a role whose signed definition sets `knowledge_graph: true`
# (operator decision 2026-10-03: opt-in, like `document_store`).  It runs a
# SPARQL read over the graphs the TASK may read: the task's ceiling and the
# requester come from the governance layer (acc.call_context), never from the
# arguments, so a model cannot ask for a wider read.  Updates and SERVICE are
# refused by the store (RDF-04).  risk_level LOW: a ceiling-bounded read.

purpose:        "Query the collective's knowledge graph at the task's ceiling (SPARQL, read-only)."
version:        "0.1.0"
adapter_class:  "KgQuerySkill"
risk_level:     "LOW"
domain_id:      "knowledge"
tags:           ["knowledge-graph", "rdf", "sparql", "read"]

input_schema:
  type: object
  properties:
    sparql:
      type: string
      description: "A SELECT, ASK, CONSTRUCT or DESCRIBE query. Prefixes acc:, prov:, skos:, dcterms:, rdf:, rdfs:, owl:, xsd: are predeclared."
    limit:
      type: integer
      minimum: 1
      maximum: 200
      description: "Most rows (or triples) to return; default 50."
  required: ["sparql"]
  additionalProperties: false

output_schema:
  type: object
  properties:
    form:        {type: string}
    variables:   {type: array, items: {type: string}}
    rows:        {type: array, items: {type: object}}
    boolean:     {type: ["boolean", "null"]}
    triples:     {type: array, items: {type: array, items: {type: string}}}
    truncated:   {type: boolean}
    graphs_read: {type: integer}
    error:       {type: string}
  required: ["form"]
  additionalProperties: false

description: |
  Read the collective's knowledge store with SPARQL. You see only the graphs
  the current task may read (its ceiling, and the requester's own private
  graphs); everything else does not exist for this query. Read-only: updates
  and SERVICE are refused. Useful vocabulary: acc:Note, acc:PublishedNote,
  acc:Proposal, prov:wasDerivedFrom, acc:role, acc:domain, skos:broader.
  Results are capped (limit, default 50); ask a narrower question rather than
  a larger limit.
