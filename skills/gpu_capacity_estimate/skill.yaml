# skills/gpu_capacity_estimate/skill.yaml — vLLM memory sizing for one model on one GPU.
#
# The arithmetic half of the GPU capacity advisor (backlog 019 / proposal 057),
# ported from ConfigIQ's aisimulate SDK (acc/gpu_sizing.py). Pure function: no
# network, no host access. The agent fetches config.json itself.

purpose:        "Estimate GPU memory, KV-cache capacity and tensor-parallel size for serving a model with vLLM."
version:        "0.1.0"
adapter_class:  "GpuCapacityEstimateSkill"
risk_level:     "LOW"
domain_id:      "capacity_planning"
tags:           ["capacity", "gpu", "vllm", "sizing", "advisor"]

input_schema:
  type: object
  properties:
    model_config:
      type: object
      description: "The model's Hugging Face config.json (as fetched from huggingface.co/<id>/raw/main/config.json)."
    gpu:
      type: string
      enum: [a30, a100_pcie, a100_sxm, l4, l40s, h100_pcie, h100_sxm, h200_sxm,
             b200_sxm, b300_sxm, gb200, gb300, rtx_pro_6000_server]
    max_model_len:
      type: integer
      minimum: 1
      description: "vLLM --max-model-len; defaults to config.json max_position_embeddings."
    tensor_parallel_size:
      type: integer
      enum: [1, 2, 4, 8]
      description: "Omit to get the smallest size that fits one max_model_len sequence."
    gpu_memory_utilization:
      type: number
      exclusiveMinimum: 0
      maximum: 1
    kv_cache_dtype:
      type: string
      enum: [auto, fp8, fp8_e4m3, fp8_e5m2, bfloat16, float16]
    weight_bytes_per_param:
      type: number
      exclusiveMinimum: 0
      maximum: 4
      description: "Override the weight width (0.5 = 4-bit, 1 = FP8/INT8, 2 = BF16)."
    num_parameters:
      type: integer
      minimum: 1
      description: "Exact parameter count when known (safetensors metadata); otherwise estimated from config.json."
    avg_tokens_per_request:
      type: integer
      minimum: 1
      description: "Typical prompt + completion tokens, for realistic concurrency."
    target_concurrency:
      type: integer
      minimum: 1
      description: "Concurrent requests to serve; returns replicas_needed and gpus_needed."
    max_num_batched_tokens:
      type: integer
      minimum: 1
  required: [model_config, gpu]
  additionalProperties: false

output_schema:
  type: object
  properties:
    fits: { type: boolean }
    gpus_per_replica: { type: integer }
    per_gpu: { type: object }
    serving_config: { type: object }
  required: [fits, gpus_per_replica, per_gpu, serving_config]

description: |
  Sizes one vLLM replica: weights per GPU, the KV-cache budget vLLM's
  gpu_memory_utilization leaves after weights, activations, NCCL buffers and a
  3.5 GiB runtime reserve, how many tokens and concurrent sequences that holds,
  and the smallest tensor-parallel size that fits. Handles GQA, MLA, MoE,
  sliding-window hybrids and quantized weights (quantization_config).

  It is the naive memory model, not a latency model: it does not predict
  TTFT/TPOT. Check its numbers against live vllm:kv_cache_usage_perc
  (prometheus_query). Formulas from redhat-performance/aisimulate (ConfigIQ),
  Apache-2.0 — see acc/gpu_sizing.py.
