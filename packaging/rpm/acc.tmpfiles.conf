# State roots for the acc user (IN-06).  Rootless cells run as a sub-uid of
# acc; acc-deploy handles the per-directory ownership the mounts need.
d /var/lib/acc 0750 acc acc -
d /var/lib/acc/packages 0750 acc acc -
d /var/lib/acc/instances 0750 acc acc -
d /var/lib/acc/workspaces 0750 acc acc -
d /var/lib/acc/logs 0750 acc acc -
d /var/lib/acc/sessions 0750 acc acc -
d /var/lib/acc/trace 0750 acc acc -
d /var/log/acc 0750 acc acc -
d /run/user/%U 0700 acc acc -
