# State roots for the acc user (IN-06).  Rootless cells run as a sub-uid of
# acc; acc-deploy handles the per-directory ownership the mounts need.
# IN-07: shared with the operator through group acc -- setgid, group-writable
# (join with `usermod -aG acc <user>`).  The logs stay group-readable only.
d /var/lib/acc 2770 acc acc -
d /var/lib/acc/packages 2770 acc acc -
d /var/lib/acc/instances 2770 acc acc -
d /var/lib/acc/workspaces 2770 acc acc -
d /var/lib/acc/logs 2770 acc acc -
d /var/lib/acc/sessions 2770 acc acc -
d /var/lib/acc/trace 2770 acc acc -
d /var/log/acc 0750 acc acc -
d /run/user/%U 0700 acc acc -
