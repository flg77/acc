---
# provision — CREATE + UPDATE. Idempotent; re-run after a change. MUTATES the host
# only with apply=true; apply=false prints the plan and changes nothing.

- name: Provision — the plan
  ansible.builtin.debug:
    msg:
      - "host          : {{ inventory_hostname }}"
      - "packages      : {{ (_acc_build_host_packages + (_acc_build_host_packages_copr if acc_build_host_copr else []) + (_acc_build_host_packages_aarch64 if acc_build_host_aarch64 else [])) | join(' ') }}"
      - "epel          : {{ acc_build_host_epel_repo or '(the host has its own)' }}"
      - "deploy key    : {{ acc_build_host_deploy_key or '(none)' }} (made once; the public half is added to acc-spearhead by hand)"
      - "build user    : {{ acc_build_host_user }} (home {{ acc_build_host_home }}, groups mock, sub-ids {{ acc_build_host_subid_start }}+{{ acc_build_host_subid_count }}, lingering)"
      - "directories   : {{ acc_build_host_build_root }}/{pip-cache,tmp}  {{ acc_build_host_gnupghome }} (0700, EMPTY — the key is moved by hand)"
      - "ssh keys      : {{ _acc_build_host_keys | length }} authorized key(s) for {{ acc_build_host_user }}"
      - "mock chroots  : {{ (acc_build_host_mock_chroots + (acc_build_host_mock_chroots_aarch64 if acc_build_host_aarch64 else [])) | join(' ') }}"
      - "apply         : {{ apply | bool }}{{ '' if apply | bool else '  (DRY RUN — nothing changes; re-run with -e apply=true)' }}"

- name: Provision — nothing more without apply=true
  ansible.builtin.meta: end_host
  when: not (apply | bool)

- name: Provision — EPEL is enabled
  ansible.builtin.command: "subscription-manager repos --enable {{ acc_build_host_epel_repo }}"
  register: _acc_build_host_epel
  changed_when: "'is enabled' in _acc_build_host_epel.stdout"
  failed_when: false
  when: acc_build_host_epel_repo | length > 0

- name: Provision — refuse an EPEL repo the host cannot see
  ansible.builtin.assert:
    that:
      - _acc_build_host_epel.rc == 0
    fail_msg: >-
      subscription-manager cannot enable {{ acc_build_host_epel_repo }}:
      {{ _acc_build_host_epel.stderr | default('') | trim }}. The host's content view must
      carry EPEL (HOWTO §1): hammer host update --content-view-environments <one that does>.
  when: acc_build_host_epel_repo | length > 0

- name: Provision — packages
  ansible.builtin.dnf:
    name: "{{ _acc_build_host_packages + (_acc_build_host_packages_copr if acc_build_host_copr else []) + (_acc_build_host_packages_aarch64 if acc_build_host_aarch64 else []) }}"
    state: present

- name: Provision — the build user
  ansible.builtin.user:
    name: "{{ acc_build_host_user }}"
    comment: "ACC release build host user"
    home: "{{ acc_build_host_home }}"
    create_home: true
    shell: /bin/bash
    groups: [mock]
    append: true

- name: Provision — sub-uid / sub-gid range for rootless podman
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    regexp: "^{{ acc_build_host_user }}:"
    line: "{{ acc_build_host_user }}:{{ acc_build_host_subid_start }}:{{ acc_build_host_subid_count }}"
    create: true
    mode: "0644"
  loop: [/etc/subuid, /etc/subgid]

- name: Provision — lingering, so rootless podman has a session bus without a login
  ansible.builtin.command: "loginctl enable-linger {{ acc_build_host_user }}"
  args:
    creates: "/var/lib/systemd/linger/{{ acc_build_host_user }}"

- name: Provision — directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ acc_build_host_user }}"
    group: "{{ acc_build_host_user }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ acc_build_host_build_root }}", mode: "0755" }
    - { path: "{{ acc_build_host_build_root }}/pip-cache", mode: "0755" }
    - { path: "{{ acc_build_host_build_root }}/tmp", mode: "0755" }
    - { path: "{{ acc_build_host_gnupghome }}", mode: "0700" }

# ansible.builtin only, like ansible/acc-distribute: no collection to install
# before the role runs, in an AAP execution environment or on a bare controller.
# A home outside /home is var_t: sshd may not read its authorized_keys and the
# login is refused ("Could not open user ... authorized keys: Permission
# denied"). Label it as /home is labelled.
- name: Provision — SELinux labels the home like /home
  ansible.builtin.shell: |
    set -euo pipefail
    if ! semanage fcontext -l -C | grep -q "^{{ acc_build_host_home }} = /home$"; then
      semanage fcontext -a -e /home "{{ acc_build_host_home }}"
      echo added
    fi
  args:
    executable: /bin/bash
  register: _acc_build_host_fcontext
  changed_when: "'added' in _acc_build_host_fcontext.stdout"
  when: ansible_selinux.status | default('disabled') == 'enabled'

- name: Provision — the build user's ~/.ssh
  ansible.builtin.file:
    path: "{{ acc_build_host_home }}/.ssh"
    state: directory
    owner: "{{ acc_build_host_user }}"
    group: "{{ acc_build_host_user }}"
    mode: "0700"

- name: Provision — the operator's ssh keys (one line each, idempotent)
  ansible.builtin.lineinfile:
    path: "{{ acc_build_host_home }}/.ssh/authorized_keys"
    line: "{{ item }}"
    create: true
    owner: "{{ acc_build_host_user }}"
    group: "{{ acc_build_host_user }}"
    mode: "0600"
  loop: "{{ _acc_build_host_keys }}"
  no_log: true

# The private half never leaves the host and is never printed; status prints the
# public half for the deploy key.
- name: Provision — the acc-spearhead deploy key (made once)
  ansible.builtin.command: >-
    ssh-keygen -q -t rsa -b 4096 -N '' -C "{{ acc_build_host_user }}@{{ inventory_hostname }} acc-spearhead read-only"
    -f {{ acc_build_host_deploy_key }}
  args:
    creates: "{{ acc_build_host_deploy_key }}"
  become_user: "{{ acc_build_host_user }}"
  when: acc_build_host_deploy_key | length > 0

- name: Provision — git reaches GitHub with that key
  ansible.builtin.blockinfile:
    path: "{{ acc_build_host_home }}/.ssh/config"
    create: true
    owner: "{{ acc_build_host_user }}"
    group: "{{ acc_build_host_user }}"
    mode: "0600"
    marker: "# {mark} acc-build-host: github.com"
    block: |
      Host github.com
          IdentityFile {{ acc_build_host_deploy_key }}
          IdentitiesOnly yes
          StrictHostKeyChecking accept-new
  when: acc_build_host_deploy_key | length > 0

- name: Provision — relabel the home (after everything above wrote into it)
  ansible.builtin.command: "restorecon -RF {{ acc_build_host_home }}"
  changed_when: false
  when: ansible_selinux.status | default('disabled') == 'enabled'

- name: Provision — aarch64 binfmt is registered (qemu-user-static)
  ansible.builtin.systemd:
    name: systemd-binfmt
    state: restarted
  when: acc_build_host_aarch64 | bool

- name: Provision — every chroot has a mock config
  ansible.builtin.stat:
    path: "{{ _acc_build_host_mock_config_dir }}/{{ item }}.cfg"
  loop: "{{ acc_build_host_mock_chroots + (acc_build_host_mock_chroots_aarch64 if acc_build_host_aarch64 else []) }}"
  register: _acc_build_host_cfgs

- name: Provision — refuse a chroot mock-core-configs does not know
  ansible.builtin.assert:
    that:
      - _acc_build_host_cfgs.results | rejectattr('stat.exists') | list | length == 0
    fail_msg: >-
      No mock config for:
      {{ _acc_build_host_cfgs.results | rejectattr('stat.exists') | map(attribute='item') | join(', ') }}.
      mock-core-configs on this host is too old for that release, or the name is wrong.

- name: Provision — smoke (forced on apply)
  ansible.builtin.include_tasks: smoke.yml
