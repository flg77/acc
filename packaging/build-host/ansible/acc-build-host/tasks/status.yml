---
# status — READ-ONLY. What the host has and what it lacks, as the smoke check sees
# it, without asserting: every task is changed_when:false, safe on any cadence.

- name: Status — run the verification script in report mode
  ansible.builtin.script:
    cmd: >-
      verify-build-host.sh --report --quick
      --user {{ acc_build_host_user }}
      --build-root {{ acc_build_host_build_root }}
      --gnupghome {{ acc_build_host_gnupghome }}
      --min-free-gb {{ acc_build_host_min_free_gb }}
      --chroots "{{ (acc_build_host_mock_chroots + (acc_build_host_mock_chroots_aarch64 if acc_build_host_aarch64 else [])) | join(' ') }}"
      {{ ('--fingerprint ' ~ acc_build_host_key_fingerprint) if acc_build_host_key_fingerprint else '' }}
  register: _acc_build_host_status
  changed_when: false
  failed_when: false

- name: Status — report
  ansible.builtin.debug:
    msg: "{{ _acc_build_host_status.stdout_lines }}"
