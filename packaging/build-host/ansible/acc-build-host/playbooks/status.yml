---
# status — thin wrapper: one AAP Job Template target. Same as
#   ansible-playbook ../site.yml -e acc_build_host_operation=status
- name: acc-build-host — status
  hosts: "{{ acc_build_host_targets | default('build_hosts') }}"
  become: true
  gather_facts: true
  roles:
    - role: acc-build-host
      vars:
        acc_build_host_operation: status
