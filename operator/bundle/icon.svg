<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Agentic Cell Corpus</title>
  <!-- A cell: an outer membrane (the governance boundary) around a small
       collective of connected agents. Original artwork for the operator's
       OLM icon; the CSV carries this file base64-encoded. -->
  <polygon points="32,3 57,17.5 57,46.5 32,61 7,46.5 7,17.5"
           fill="#1f2a44" stroke="#4fa3e0" stroke-width="3" stroke-linejoin="round"/>
  <g stroke="#9ad0f5" stroke-width="2" stroke-linecap="round">
    <line x1="32" y1="20" x2="21" y2="38"/>
    <line x1="32" y1="20" x2="43" y2="38"/>
    <line x1="21" y1="38" x2="43" y2="38"/>
    <line x1="32" y1="20" x2="32" y2="32"/>
    <line x1="21" y1="38" x2="32" y2="32"/>
    <line x1="43" y1="38" x2="32" y2="32"/>
  </g>
  <circle cx="32" cy="20" r="5" fill="#f5b942"/>
  <circle cx="21" cy="38" r="5" fill="#4fa3e0"/>
  <circle cx="43" cy="38" r="5" fill="#4fa3e0"/>
  <circle cx="32" cy="32" r="3.5" fill="#ffffff"/>
</svg>
