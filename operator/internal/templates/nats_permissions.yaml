# NATS NKey publish/subscribe permission matrix — canonical source.
#
# Proposal 013 (Phase 0c).  This file is the SINGLE SOURCE OF TRUTH
# for the per-identity NATS authorization matrix.  It is consumed by
# BOTH:
#
#   * the operator's Go nats.conf renderer
#     (operator/internal/templates/nats_config.go — //go:embed), and
#   * the standalone Python CLI (scripts/acc-nkeys) via
#     acc/nats_permissions.py.
#
# Editing it in one place keeps the two language renderers in lock
# step.  tests/test_nats_permissions.py is a contract test that fails
# CI if a subject helper in acc/signals.py is left uncovered here.
#
# Subject globs use NATS wildcards:
#   *  matches exactly one token
#   >  matches one or more trailing tokens
# The second token of every acc subject is the collective_id, so it
# is always written as `*` (one matrix serves every collective on the
# server).
#
# Identities: the six agent roles, plus `tui` (the read-only operator
# surface used by the TUI/CLI) and `leaf` (the edge leaf-node link to
# the hub).

# --- shared building blocks (YAML anchors keep the matrix DRY) -------

# Worker roles (ingester, analyst, synthesizer, coding_agent,
# observer) all carry the same permissions: they receive work and
# report on it, but may not publish the arbiter-only control subjects
# (plan.*, centroid, domain.*, role_update — the A-011/A-012/A-016
# invariants).
_worker_publish: &worker_publish
  - acc.*.heartbeat
  - acc.*.register
  - acc.*.task.complete
  - acc.*.task.progress
  - acc.*.queue.*
  - acc.*.backpressure.*
  - acc.*.knowledge.*
  - acc.*.eval.*
  - acc.*.episode.nominate
  - acc.*.alert
  # `20260923-lessons-that-travel` Phase 8 -- proposal ANNOUNCEMENTS
  # (pending, outcome, dispatch-failed).  Every agent that queues a
  # proposal says so on this subject, and the Compliance screen renders
  # the row from it; it carries no mutation, so it belongs with alert /
  # knowledge / eval rather than with the arbiter-only control subjects.
  # Without it an NKey-enforced deployment could not announce a pending
  # proposal at all (measured against the matrix, 2026-09-23).
  - acc.*.assistant.*
  # `20260923-lessons-that-travel` Phase 9 -- a ``can_route`` role ASKS the
  # arbiter to re-dispatch; it still may not publish `task.assign` itself.
  - acc.*.route.request
  - acc.bridge.*.*.delegate
  - acc.bridge.*.*.result
  - acc.bridge.*.pending

_worker_subscribe: &worker_subscribe
  - acc.*.route.request
  - acc.*.task.assign
  - acc.*.task.cancel
  # `20260923-lessons-that-travel` Phase 6 -- a worker hears its own inbox
  # (it filters on the agent_id token); only the arbiter and the operator
  # surface may publish there, so member-to-member stays relayed.
  - acc.*.agent.*.inbox
  - acc.*.role_update
  - acc.*.role_approval
  - acc.*.plan.*
  - acc.*.centroid
  - acc.*.domain.*
  - acc.*.knowledge.*
  - acc.*.eval.*
  - acc.bridge.*.*.delegate
  - acc.bridge.*.*.result

roles:
  arbiter:
    # The arbiter orchestrates: it alone may publish the control
    # subjects, and it subscribes to everything to observe the
    # collective.
    publish:
      - acc.*.task.assign
      - acc.*.task.cancel
      - acc.*.agent.*.inbox
      - acc.*.plan.*
      - acc.*.centroid
      - acc.*.domain.*
      - acc.*.role_update
      - acc.*.role_approval
      # `20260923-lessons-that-travel` Phase 8 -- the arbiter is the
      # identity that DISPATCHES an approved proposal, so it needs the
      # subject every dispatch lands on: `collective.reconcile` (spawn)
      # and `assistant.*` (infuse / role_gap / publish outcomes).  Before
      # this, no identity in the matrix could publish either, so those
      # four proposal kinds were undispatchable under NKeys.
      - acc.*.collective.reconcile
      - acc.*.assistant.*
      - acc.*.route.request
      - acc.*.heartbeat
      - acc.*.register
      - acc.*.alert
      - acc.*.knowledge.*
      - acc.bridge.*.*.delegate
      - acc.bridge.*.*.result
      - acc.bridge.*.pending
    subscribe:
      - acc.>

  ingester:
    publish: *worker_publish
    subscribe: *worker_subscribe

  analyst:
    publish: *worker_publish
    subscribe: *worker_subscribe

  synthesizer:
    publish: *worker_publish
    subscribe: *worker_subscribe

  coding_agent:
    publish: *worker_publish
    subscribe: *worker_subscribe

  observer:
    # The `observer` agent role is read-mostly but still emits its own
    # heartbeat/register; reuse the worker set.
    publish: *worker_publish
    subscribe: *worker_subscribe

  tui:
    # The TUI/CLI operator surface: read-only on the bus EXCEPT for
    # the operator-initiated subjects (submit a plan, decide an
    # oversight item, issue a task or a cancel).
    publish:
      - acc.*.plan.submit
      - acc.*.oversight.*
      - acc.*.task.assign
      - acc.*.task.cancel
      - acc.*.agent.*.inbox
    subscribe:
      - acc.>

  leaf:
    # The edge leaf-node link only ever carries cross-collective
    # bridge traffic to/from the hub.
    publish:
      - acc.bridge.>
    subscribe:
      - acc.bridge.>
