# regulatory_layer/nexus/vocabulary.yaml
#
# The external risk vocabulary ACC speaks: the ids of IBM's AI Atlas Nexus
# (github.com/IBM/risk-atlas-nexus, the knowledge graph asago's policy
# mapper keys its `risk-extraction.json` on).  A pinned SNAPSHOT of the ids
# ACC references, so validation is offline and a renamed upstream id is a
# test failure here, not a silent broken link.
#
# `20260908-asago-alignment` AS-01.  Refresh: re-fetch the taxonomy files
# under src/ai_atlas_nexus/data/knowledge_graph/ and bump `fetched`.
#
# Families:
#   atlas-*   IBM AI Risk Atlas risks                      (risk_atlas_data.yaml)
#   llm*      OWASP Top 10 for LLM Applications 2025       (owasp_llm_2.0_data.yaml)
#   asi*      OWASP Top 10 for Agentic Applications 2026   (owasp_asi_data.yaml)
#   ast*      OWASP Agentic Skills Top 10 v1.0             (owasp_ast10_data.yaml)
#   nist-*    NIST AI RMF GenAI profile risks              (nist_ai_rmf_data.yaml)
#   nist-<fn>-<n.m>  NIST AI RMF subcategories in the form asago's policy
#             mapper emits (`nist-ms-2.5`); the Nexus keys the same
#             subcategories through its action ids (`MS-2.5-001`).  Derived,
#             not fetched: gv=GOVERN mp=MAP ms=MEASURE mg=MANAGE.
#
# Not in the Nexus (no ids to give): EU AI Act articles (the Nexus models the
# Act as risk categories and system types, not articles), ISO 42001, SOC 2.

